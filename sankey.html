<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장례 비용 흐름 · Hover</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050607;font-family:Inter,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#eee}body{overflow:auto}.page{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:12px}.board{position:relative;width:min(100%,1740px);aspect-ratio:1740/1210;cursor:crosshair;isolation:isolate}.board img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.board .layer{opacity:0;pointer-events:none;transition:opacity .08s linear}.board .layer.active{opacity:1}.hint{position:fixed;right:16px;bottom:14px;padding:9px 12px;background:rgba(18,22,23,.92);border:1px solid #363c3d;border-radius:8px;color:#d1d6d4;font-size:12px;line-height:1.45;pointer-events:none}.status{position:fixed;left:16px;bottom:14px;color:#9fa8a6;font-size:11px;pointer-events:none}@media(max-width:700px){.page{padding:0}.board{width:100%;min-width:900px}.hint{position:sticky;float:right;right:10px;bottom:10px}}
</style></head><body><main class="page"><div class="board" aria-label="장례 비용 산키 다이어그램"><img class="base" alt="장례 비용 구성 원본" data-asset="assets/base.txt"><img class="layer" data-id="1" alt="강조 경로 1" data-asset="assets/layer-01.txt"><img class="layer" data-id="2" alt="강조 경로 2" data-asset="assets/layer-02.txt"><img class="layer" data-id="3" alt="강조 경로 3" data-asset="assets/layer-03.txt"><img class="layer" data-id="4" alt="강조 경로 4" data-asset="assets/layer-04.txt"><img class="layer" data-id="5" alt="강조 경로 5" data-asset="assets/layer-05.txt"><img class="layer" data-id="6" alt="강조 경로 6" data-asset="assets/layer-06.txt"><img class="layer" data-id="7" alt="강조 경로 7" data-asset="assets/layer-07.txt"><img class="layer" data-id="8" alt="강조 경로 8" data-asset="assets/layer-08.txt"><img class="layer" data-id="9" alt="강조 경로 9" data-asset="assets/layer-09.txt"><img class="layer" data-id="10" alt="강조 경로 10" data-asset="assets/layer-10.txt"><img class="layer" data-id="11" alt="강조 경로 11" data-asset="assets/layer-11.txt"><img class="layer" data-id="12" alt="강조 경로 12" data-asset="assets/layer-12.txt"><img class="layer" data-id="13" alt="강조 경로 13" data-asset="assets/layer-13.txt"><img class="layer" data-id="14" alt="강조 경로 14" data-asset="assets/layer-14.txt"></div></main><div class="hint">각 흐름 위에 마우스를 올리면<br>사용자가 만든 해당 경로 이미지가 표시됩니다.</div><div class="status">마우스를 경로 밖으로 옮기면 원본으로 돌아옵니다.</div><script>
const board=document.querySelector('.board');const layers=[...document.querySelectorAll('.layer')];let maskPixels=null;let activeId=0;async function fetchAsset(path){const r=await fetch(path);if(!r.ok)throw new Error('Asset load failed: '+path);return 'data:image/png;base64,'+(await r.text()).trim()}const maskImage=new Image();maskImage.onload=()=>{const c=document.createElement('canvas');c.width=maskImage.naturalWidth;c.height=maskImage.naturalHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(maskImage,0,0);maskPixels=ctx.getImageData(0,0,c.width,c.height).data};fetchAsset('assets/mask.txt').then(src=>{maskImage.src=src});document.querySelectorAll('[data-asset]').forEach(async img=>{try{img.src=await fetchAsset(img.dataset.asset)}catch(e){console.error(e)}});
function setLayer(id){if(id===activeId)return;activeId=id;for(const img of layers)img.classList.toggle('active',Number(img.dataset.id)===id)}
board.addEventListener('pointermove',e=>{if(!maskPixels)return;const rect=board.getBoundingClientRect();const x=Math.max(0,Math.min(1739,Math.floor((e.clientX-rect.left)/rect.width*1740)));const y=Math.max(0,Math.min(1209,Math.floor((e.clientY-rect.top)/rect.height*1210)));const id=maskPixels[(y*1740+x)*4];setLayer(id)});board.addEventListener('pointerleave',()=>setLayer(0));
</script></body></html>
